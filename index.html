            display: flex;

            filter: brightness(0.5) blur(1px);
            z-index: -2;
            transition: all 0.8s ease-in-out;
        }

        /* --- NOWA SEKCJA DLA WIDOKU IPAD NA TELEFONIE --- */
        @media (max-width: 768px) {
            body { flex-direction: column; align-items: center; }
            
            .sidebar {

                width: 90% !important; 
                height: 80px !important; 
                left: 0 !important; 
                top: 10px !important; 
                display: flex !important; 
                flex-direction: row !important; 
                overflow-x: auto !important; 
                overflow-y: hidden !important;
                white-space: nowrap;
                margin-bottom: 20px;
            }
            .sidebar h4 { display: none; } /* Chowa napis na małym ekranie dla miejsca */
            .sidebar div { display: inline-block !important; margin-right: 10px; border-bottom: none !important; border-right: 1px solid var(--glass-border); padding: 15px !important; }

            .container { 
                margin: 10px !important; 
                width: 95% !important; 
                padding: 15px !important; 
                box-sizing: border-box;
            }

            table { font-size: 0.8em; }
            .historia-grid { grid-template-columns: 1fr 1fr !important; }
            .theme-btn-toggle { top: 10px; right: 10px; padding: 5px 10px; font-size: 0.7em; }
        }

        }
        #theme-menu.active { right: 0; }
        .theme-btn-toggle { position: fixed; right: 20px; top: 20px; z-index: 1001; background: var(--mk-red); color: white; border: none; padding: 10px 15px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 0 15px rgba(0,0,0,0.5); }

        #status-label { color: gold; margin-top: 15px; text-transform: uppercase; font-size: 0.85em; letter-spacing: 2px; font-weight: bold; min-height: 1.2em; }

    function startLoading() {
        let p = 0;
        const label = document.getElementById('status-label');
        const teraz = new Date();
        const h = teraz.getHours().toString().padStart(2, '0');
        const m = teraz.getMinutes().toString().padStart(2, '0');
        const calyCzas = h + m;
        const wagi = { '0': 5, '1': 2, '2': 8, '3': 0, '4': -2, '5': 3, '6': 6, '7': -2, '8': -1, '9': 7 };
        let x = 20;
        let sumaMod = 0;
        calyCzas.split('').forEach(cyfra => { sumaMod += wagi[cyfra]; });
        let szybkosc = Math.max(5, x + sumaMod);

        const interval = setInterval(() => {
            p++;
            document.getElementById('percent-text').innerText = p + "%";
            document.getElementById('progress-bar-fill').style.width = p + "%";
            if (p <= 20) label.innerText = "Synchronizacja czasu...";
            else if (p <= 60) label.innerText = "Hey, browser, make another row in the table...";
            else if (p <= 90) label.innerText = "Weryfikacja bazy x...";
            else label.innerText = "System gotowy!";
            if (p >= 100) {
                clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('loading-screen').style.opacity = '0';
                    setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 800);
                }, 500);
            }
        }, szybkosc);
    }

    function ustawTlo(style) {
        const bg = document.getElementById('app-bg');
        if (style.startsWith("http")) {
            bg.style.backgroundImage = `url('${style}')`;
        } else {
            bg.style.background = style;
        }
        bg.style.backgroundSize = "cover";
        bg.style.backgroundPosition = "center";
        bg.style.backgroundAttachment = "fixed";
    }

    function inicjalizujMenuMotywow() {
        const kolibryGrid = document.getElementById('grid-kolibry');
        for(let k in MOTYWY_KOLIBRY) {
            let b = document.createElement('div'); b.className = 't-btn'; b.style.background = MOTYWY_KOLIBRY[k];
            b.onclick = () => ustawTlo(MOTYWY_KOLIBRY[k]); b.innerText = k; kolibryGrid.appendChild(b);
        }

        const customGrid = document.getElementById('grid-custom');
        for(let nazwa in MOJE_WLASNE_LINKI) {
            let link = MOJE_WLASNE_LINKI[nazwa];
            if (link !== "TU_WKLEJ_LINK" && link !== "") {
                let b = document.createElement('div'); b.className = 't-btn'; 
                b.style.background = `url('${link}')`;
                b.onclick = () => ustawTlo(link); b.innerText = nazwa; customGrid.appendChild(b);
            }
        }

        const charGrid = document.getElementById('grid-chars');
        for(let p in MOTYWY_POSTACI) {
            let b = document.createElement('div'); b.className = 't-btn'; b.style.background = MOTYWY_POSTACI[p];
            b.onclick = () => ustawTlo(MOTYWY_POSTACI[p]); b.innerText = p; charGrid.appendChild(b);
        }
        const ekstraGrid = document.getElementById('grid-ekstra');
        for(let k in MOTYWY_EKSTRAKLASA) {

            b.onclick = () => ustawTlo(MOTYWY_EKSTRAKLASA[k]); b.innerText = k; ekstraGrid.appendChild(b);
        }
        const pierwszaGrid = document.getElementById('grid-pierwsza');
        for(let k in MOTYWY_PIERWSZA_LIGA) {
            let b = document.createElement('div'); b.className = 't-btn'; b.style.background = MOTYWY_PIERWSZA_LIGA[k];
            b.onclick = () => ustawTlo(MOTYWY_PIERWSZA_LIGA[k]); b.innerText = k; pierwszaGrid.appendChild(b);
        }
        const laligaGrid = document.getElementById('grid-laliga');
        for(let k in MOTYWY_LALIGA) {
            let b = document.createElement('div'); b.className = 't-btn'; b.style.background = MOTYWY_LALIGA[k];
            b.onclick = () => ustawTlo(MOTYWY_LALIGA[k]); b.innerText = k; laligaGrid.appendChild(b);
        }
        const sysGrid = document.getElementById('grid-sys');
        for(let s in MOTYWY_SYS) {
            let b = document.createElement('div'); b.className = 't-btn'; b.style.background = MOTYWY_SYS[s];

    const rodzina = ["Mama", "Tata", "Miłosz", "Mikołaj"];
    let zawodnicy = [];

    function inicjalizuj() {
        const zapis = localStorage.getItem(STORAGE_KEY);
        zawodnicy = zapis ? JSON.parse(zapis) : rodzina.map(n => ({ name: n, medale: [0,0,0,0], elo: 1000, historia: [] }));
        const nav = document.getElementById('cup-nav');
        for (const cup in daneGry) {
            const b = document.createElement('div'); b.style = "padding:8px; color:#aaa; cursor:pointer; font-size:0.75em; border-bottom:1px solid rgba(255,255,255,0.05);";
            b.innerText = "🏆 " + cup; b.onclick = () => {
                const target = document.getElementById(`header-${cup}`);
                if(target) target.scrollIntoView({ behavior: 'smooth' });
            };
            nav.appendChild(b);
        }
        document.getElementById('select-zawodnik').innerHTML = rodzina.map(n => `<option value="${n}">${n}</option>`).join('');
        inicjalizujMenuMotywow();
        ustawTlo(MOTYWY_SYS["Deep Space"]);
        odswiezRanking();
        odswiezMenuTras();
        startLoading();
    }

    function toggleThemeMenu() { document.getElementById('theme-menu').classList.toggle('active'); }

    function odswiezRanking() {

    // 🔥 Ranking olimpijski: złoto > srebro > brąz > platyna
    zawodnicy.sort((a, b) => {
        if (b.medale[0] !== a.medale[0]) return b.medale[0] - a.medale[0];
        if (b.medale[1] !== a.medale[1]) return b.medale[1] - a.medale[1];
        if (b.medale[2] !== a.medale[2]) return b.medale[2] - a.medale[2];
        if (b.medale[3] !== a.medale[3]) return b.medale[3] - a.medale[3];
        return 0;
    });

    document.getElementById('ranking-body').innerHTML =
        zawodnicy.map((z, i) => `
            <tr class="gracz-row" onclick="pokazHistorie('${z.name}')">
                <td>${i+1}</td>
                <td><b>${z.name}</b></td>
                <td style="color:gold">${z.medale[0]}</td>
                <td style="color:silver">${z.medale[1]}</td>
                <td style="color:#cd7f32">${z.medale[2]}</td>
                <td style="color:lightgreen">${z.medale[3]}</td>
                <td class="elo-cell">${z.elo.toFixed(1)}</td>
            </tr>
        `).join('');
}


    

    function pokazHistorie(imie) {
        const z = zawodnicy.find(x => x.name === imie);
        if(!z || z.historia.length === 0) return alert("Brak wyścigów!");
        document.getElementById('historia-tytul').innerText = "KIEROWCA: " + imie.toUpperCase();
        document.getElementById('lista-osiagniec').innerHTML = z.historia.map(h => {
            const imgUrl = IKONY_TRAS[h.gra];
            const iconHtml = (imgUrl && imgUrl !== "TU_WKLEJ_LINK" && imgUrl !== "") 
                ? `<img src="${imgUrl}" class="trasa-img" onerror="this.outerHTML='<div class=\'trasa-img\'>🏆</div>'">` 
                : `<div class="trasa-img">🏆</div>`;
            return `
                <div class="karta-wyscigu" style="border-left: 5px solid ${h.v == 1 ? 'gold' : h.v == 0.6 ? 'silver' : h.v == 0.3 ? '#cd7f32' : 'lightgreen'}">
                    ${iconHtml}
                    <div style="display: flex; flex-direction: column; padding: 5px;">
                        <span style="font-weight:bold; font-size:0.9em;">${h.gra}</span>
                        <span style="font-size:0.7em; color:gold;">${h.v == 1 ? '🥇 ZŁOTO' : h.v == 0.6 ? '🥈 SREBRO' : h.v == 0.3 ? '🥉 BRĄZ' : '💿 PLATYNA'}</span>
                        <span style="font-size:0.6em; color:#ccc;">${h.data}</span>
                    </div>
                </div>
            `;
        }).join('');
        document.getElementById('panel-historii').style.display = 'block';
    }

    function odswiezMenuTras() {
        const imie = document.getElementById('select-zawodnik').value;
        const gracz = zawodnicy.find(z => z.name === imie);
        let html = "";
        for (const [cup, tracks] of Object.entries(daneGry)) {
            html += `<div class="cup-header" id="header-${cup}">${cup} Cup</div>`;
            tracks.forEach(t => {
                const hist = gracz.historia.filter(h => h.gra === t);
                let klasa = (hist.length > 0) ? (hist[0].v === 1.0 ? "bg-gold" : hist[0].v === 0.6 ? "bg-silver" : hist[0].v === 0.3 ? "bg-bronze" : "bg-platinum") : "";
                html += `<div class="track-item ${klasa} ${wybranaTrasa === t ? 'selected' : ''}" onclick="wybierzTrase('${t.replace(/'/g, "\\'")}')">${t}</div>`;
            });
        }
        document.getElementById('track-list-container').innerHTML = html;
    }

    function wybierzTrase(t) { wybranaTrasa = t; odswiezMenuTras(); }

    function przyznajMedal() {
        const imie = document.getElementById('select-zawodnik').value;
        const score = parseFloat(document.getElementById('select-medal').value);
        if(!wybranaTrasa) return alert("Wybierz trasę!");
        const gracz = zawodnicy.find(z => z.name === imie);
        const expected = 1 / (1 + Math.pow(10, (1000 - gracz.elo) / 400));
        gracz.elo = Math.round((gracz.elo + K_FACTOR * (score - expected)) * 10) / 10;
        if(score === 1.0) gracz.medale[0]++; 
        else if(score === 0.6) gracz.medale[1]++; 
        else if(score === 0.3) gracz.medale[2]++; 
        else gracz.medale[3]++;
        gracz.historia.unshift({ gra: wybranaTrasa, v: score, data: new Date().toLocaleDateString() });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(zawodnicy));
        odswiezRanking(); odswiezMenuTras();
        alert("Wynik zapisany!");
    }

    window.onload = inicjalizuj;
</script>
